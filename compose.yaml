name: mediator-bot

services:
  mediator-bot:
    image: mediator-bot:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - ./deploy/mediator-bot.env
    environment:
      DOTNET_ENVIRONMENT: Production
      Storage__DatabasePath: /app/data/mediator-bot.db
    volumes:
      - mediator-bot-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  mediator-bot-data:
    name: mediator-bot-data
