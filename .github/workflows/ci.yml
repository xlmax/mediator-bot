name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test and Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore MediatorBot.slnx

      - name: Build
        run: dotnet build MediatorBot.slnx --configuration Release --no-restore

      - name: Test
        run: >-
          dotnet test MediatorBot.Tests/MediatorBot.Tests.csproj
          --configuration Release
          --no-build
          --logger "console;verbosity=normal"

      - name: Validate Compose configuration
        run: |
          cp deploy/mediator-bot.env.example deploy/mediator-bot.env
          docker compose config --quiet

      - name: Build deployment image
        run: docker build --tag mediator-bot:ci .
